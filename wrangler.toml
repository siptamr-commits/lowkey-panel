name = "lowkey-panel"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ===== D1 Database =====
[[d1_databases]]
binding = "DB"
database_name = "lowkey-db"
database_id = "YOUR_D1_DATABASE_ID"

# ===== Environment Variables =====
# These should be set via `wrangler secret put` or in the Cloudflare dashboard
# ADMIN_PASSWORD = "change-me"
# TELEGRAM_BOT_TOKEN = "your-bot-token"
# TELEGRAM_ADMIN_IDS = "your-telegram-id"
# TELEGRAM_CHANNEL = "@YourChannel"

# ===== Routes (optional) =====
# routes = [
#   { pattern = "panel.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
